name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Every unit test suite under components/nodes: traj_relay's point budget
  # for domain 2's MTU, the stop-distance metric awk and the before/after demo
  # orchestrator's local gates. None of them needs ROS or the board.
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pytest and PyYAML
        run: python3 -m pip install --user pytest pyyaml

      - name: Run node and metrics unit tests
        run: python3 -m pytest -q
        working-directory: components/nodes

      # The demo reel composer lives under scripts/ with the other operator
      # tooling rather than under components/nodes, so pytest has to be pointed
      # at it separately. It needs Pillow, and only Pillow: the panes are drawn
      # with it and the frames are piped to ffmpeg, which this step never runs.
      - name: Install Pillow
        run: python3 -m pip install --user pillow

      - name: Run demo reel tests
        run: python3 -m pytest -q
        working-directory: scripts
